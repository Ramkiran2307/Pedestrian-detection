# Render Blueprint for the Swachh Netra API server (Flask + SQLite).
# Render dashboard -> New -> Blueprint -> pick this repository. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: swachh-netra-api
    runtime: python
    # "starter" is needed for the persistent disk below (the database and evidence survive
    # restarts and redeploys). For a free demo: set plan to "free" and delete the disk
    # block - data is then wiped whenever the service restarts or sleeps.
    plan: starter
    buildCommand: pip install -r server/requirements.txt
    # one worker: SQLite + the in-process job list must live in a single process
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT "server.app:create_app()"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LW_DATA_DIR
        value: /var/data
      - key: LW_API_KEY                 # copy into edge/config.yaml -> server.api_key
        generateValue: true
      - key: LW_DASHBOARD_PASSWORD      # access code officers type into the dashboard
        generateValue: true
      - key: LW_CORS_ORIGINS            # replace with your exact Vercel address after deploying
        value: https://*.vercel.app
      - key: LW_DEV_TOOLS               # video upload needs the AI libraries: laptop only
        value: "0"
      - key: LW_MUNICIPALITY
        value: Demo Municipal Corporation
      - key: LW_SEED_SAMPLE             # sample cases on an empty database; set to 0 for none
        value: "40"
    disk:
      name: litterwatch-data
      mountPath: /var/data
      sizeGB: 1
