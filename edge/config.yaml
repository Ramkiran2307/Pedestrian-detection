# Litter-watch edge configuration (one camera, one clean zone).
# Relative paths are relative to this file's folder.

camera:
  id: CAM-01
  name: "Demo camera - College main gate"
  location: "Main gate footpath"
  ward: "Ward 12"
  source: ../samples/demo_litter.mp4   # video file, webcam index ("0") or rtsp:// URL
  realtime: null        # null = auto (wall clock for live cameras, video time for files)
  frame_stride: 1       # 2-3 on a Raspberry Pi
  max_width: 1280
  loop: false

models:
  device: cpu           # "0" for an NVIDIA GPU
  tracker: bytetrack.yaml
  vehicle:              # yolov8n -> cars, motorcycles, buses, trucks
    weights: ../models/yolov8n.pt
    conf: 0.35
    imgsz: 640
    classes: [2, 3, 5, 7]
  person:               # yolo26s -> people
    weights: ../models/yolo26s.pt
    conf: 0.40
    imgsz: 640
    classes: [0]
  plate:                # custom plate detector (used only for offenders)
    weights: ../models/license_plate.pt
    conf: 0.25
    imgsz: 640

zone:
  name: "Clean Zone A"
  # [x, y] as fractions of the frame. Draw it with:  python -m edge.draw_zone
  polygon: [[0.02, 0.55], [0.98, 0.55], [0.98, 0.98], [0.02, 0.98]]

litter:
  work_width: 640             # litter analysis resolution
  warmup_seconds: 2.0         # time to learn the empty scene
  learn_seconds: 0.5          # a spot must be seen empty this long before litter there is reported
  diff_threshold: 32          # pixel difference (0-255) that counts as "changed"
  min_area_px: 60             # smallest litter blob (at work_width)
  max_area_ratio: 0.12        # largest blob (a dumped pile of bags), as a fraction of the frame
  group_px: 15                # pieces closer than this (px at work_width) count as one pile
  growth_ratio: 1.5           # a reported pile that grows 1.5x = new litter added to it
  static_seconds: 1.5         # must stay still this long to count as litter
  max_drift_px: 12
  miss_tolerance_seconds: 0.6
  confirmed_miss_seconds: 4.0   # reported litter can be hidden this long before it is forgotten
  actor_margin: 0.12          # people/vehicle boxes are enlarged by 12% before masking
  actor_memory_seconds: 1.0
  bg_learning_rate: 0.02
  global_change_ratio: 0.35   # >35% of the zone changed at once = lighting change
  absorb_after_seconds: 30
  merge_seconds: 8            # more litter by the same offender within 8 s = same incident

cache:
  hold_seconds: 4.0           # keep each person/vehicle 4 s after it leaves, then bin it
  history_seconds: 12
  person_crops: 3
  vehicle_crops: 12          # more views of the vehicle = more plate frames to enhance
  crop_every_n: 2

attribution:
  lookback_seconds: 2.5
  person_max_distance: 1.2
  vehicle_max_distance: 1.5
  report_unattributed: true   # still report litter even if nobody could be blamed

ocr:
  engine: plate-ocr           # plate-ocr = enhance blurry plates + licence-plate OCR models; easyocr = old reader
  plate_models: [cct-s-v2-global-model, cct-xs-v2-global-model]
  max_frames: 12              # sharpest plate crops fused for enhancement
  high_confidence: 0.65       # the best reading is always filled in; these only label how sure it is
  low_confidence: 0.3         # (an officer confirms every plate before a notice can be issued)
  languages: [en]             # EasyOCR settings (fallback engine)
  gpu: false
  min_confidence: 0.15

evidence:
  pre_seconds: 5
  post_seconds: 3
  clip_width: 960
  jpeg_quality: 80
  outbox_dir: outbox
  sent_dir: sent
  keep_local: true

server:
  enabled: true
  url: http://127.0.0.1:5000
  api_key: demo-edge-key      # must match LW_API_KEY on the server
  heartbeat_seconds: 15
  timeout_seconds: 20
  retry_seconds: 10

preview:
  enabled: true
  host: 127.0.0.1             # 0.0.0.0 on the Pi so the dashboard laptop can watch
  port: 8090
  width: 960
  show_window: false
